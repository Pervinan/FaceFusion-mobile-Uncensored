name: Build FaceFusion Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Show toolchain versions
        run: |
          echo "--- project expects ---"
          grep -nE 'ndkVersion|cmake|compileSdk|buildToolsVersion' work/android/app/build.gradle.kts || true
          echo "--- installed NDKs ---"
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || echo "none"

      - name: Build debug APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-Mobile-APK
          path: work/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30
